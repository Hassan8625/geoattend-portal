services:
  - type: web
    name: geoattend-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set your Supabase / PostgreSQL URI here to persist data across redeploys

